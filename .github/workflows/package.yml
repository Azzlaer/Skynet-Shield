name: Alpha distribution packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Native x86
        run: |
          cmake -S . -B build-x86 -G "Visual Studio 17 2022" -A Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-x86 --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-x86 -C Release --output-on-failure
      - name: Native x64
        run: |
          cmake -S . -B build-x64 -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-x64 --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-x64 -C Release --output-on-failure
      - name: AdminCP publish (framework dependent)
        run: dotnet publish AdminCP/SkynetShield.Admin.csproj -c Release -r win-x64 --self-contained false -o publish-admin
      - name: Packaging regression
        run: python -m unittest discover -s Tests -p test_package_release.py -v
      - name: Assemble ZIP
        run: python Tools/package_release.py --x86 build-x86/Release --x64 build-x64/Release --admin publish-admin --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: SkynetShield-1.0.0-alpha-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30
